# DHC — Signal d'activité pour la base Supabase
# Interroge la base tous les trois jours pour éviter la mise en veille
# du plan gratuit (déclenchée après 7 jours sans activité).
# Emplacement dans le dépôt : .github/workflows/veille-supabase.yml
name: Veille Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'   # vers 8 h, heure de Paris, tous les trois jours
  workflow_dispatch:          # bouton « Run workflow » pour tester à la main

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le signal d'activité
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CLE: ${{ secrets.SUPABASE_CLE }}
        run: |
          code=$(curl -s -o reponse.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping_base" \
            -H "apikey: $CLE" -H "Authorization: Bearer $CLE" \
            -H "Content-Type: application/json" -d '{}')
          echo "Réponse de la base : $code $(cat reponse.txt)"
          test "$code" = "200"
