name: Veille Supabase

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le signal d'activité
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CLE: ${{ secrets.SUPABASE_CLE }}
        run: |
          code=$(curl -s -o reponse.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping_base" \
            -H "apikey: $CLE" -H "Authorization: Bearer $CLE" \
            -H "Content-Type: application/json" -d '{}')
          echo "Réponse de la base : $code $(cat reponse.txt)"
          test "$code" = "200"
